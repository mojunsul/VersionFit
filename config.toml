# 검색·색인 설정. 값을 바꿔 색인/검색 결과 차이를 비교한다.
[models]
embedding = "text-embedding-3-small"
chat = "gpt-5.4-mini"  # nano 대비 복합 질문 정확도 높음 (progress.md 3절)
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"

[chunk]
size = 1000
overlap = 200

[search]
top_k = 8
mode = "mmr"          # similarity | mmr. 비교 결과 rag-design.md 6.1
fetch_k = 30          # mmr일 때 먼저 가져올 후보 수
own_doc_k = 3         # 외부 문서와 함께 검색할 때 항목 자체의 Boot 문서에서 관련도 순으로 먼저 확보할 근거 수
lambda_mult = 0.6     # mmr 관련도 비중 (1 = similarity와 같음). 0.5는 비슷한 섹션이 많은 문서에서 정답을 밀어냄

[collect]
candidates = 10      # 프롬프트2에 보여 줄 후보 문서 수
max_docs = 3         # 질문 한 번에 프롬프트2가 고를 최대 문서 수
term_cap = 10        # 후보 점수에서 검색어 하나가 본문에 나온 횟수를 셀 상한 (흔한 검색어가 점수를 독차지하지 않게)

[explore]
candidates = 30      # 조건 탐색에서 items 유사도 검색으로 모을 후보 수
max_items = 8        # LLM이 고를 최대 항목 수

[paths]
chroma_dir = "chroma_db"
items_json = "data/items.json"
boot_docs_dir = "data/boot_docs"
external_docs_dir = "data/external_docs"
collect_log = "data/collect_log.json"
coordinates_dir = "data/coordinates"
