# 검색·색인 설정. 값을 바꿔 색인/검색 결과 차이를 비교한다.
[models]
embedding = "text-embedding-3-small"
chat = "gpt-5.4-mini"  # nano 대비 복합 질문 정확도 높음 (progress.md 3절)
base_url = "https://gms.ssafy.io/gmsapi/api.openai.com/v1/"

[chunk]
size = 1000
overlap = 200

[search]
top_k = 8
mode = "similarity"   # similarity | mmr
fetch_k = 30          # mmr일 때 먼저 가져올 후보 수

[collect]
candidates = 10      # 프롬프트2에 보여 줄 후보 문서 수
max_docs = 3         # 질문 한 번에 프롬프트2가 고를 최대 문서 수

[paths]
chroma_dir = "chroma_db"
items_json = "data/items.json"
boot_docs_dir = "data/boot_docs"
collect_log = "data/collect_log.json"
